name: DBZ Goku Alpha — opt-in static checks
# CI runs were failing at the fork level without usable logs.
# Temporarily opt-in only; run locally with 'node dbz/tests/goku-smoke.cjs'.
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse code and validate source PNG
        run: node dbz/validate.mjs
      - name: Verify Goku state and animation data
        run: node dbz/tests/goku-smoke.cjs

      - name: Verify committed Goku sprite sheets
        run: node dbz/tests/goku-assets.cjs
      - name: Verify isolated Goku energy visuals
        run: node dbz/tests/ki-vfx-smoke.cjs
