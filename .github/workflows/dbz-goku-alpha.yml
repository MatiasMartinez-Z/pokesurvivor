name: DBZ Goku Alpha — static smoke test
on:
  push:
    branches: [dbz/goku-base-integration]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript parse errors
        run: |
          node --check dbz/goku-base.js
          node --check dbz/sprites.js
      - name: Check HTML references and PNG geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          html=Path('dbz.html').read_text(encoding='utf-8')
          assert 'src="dbz/goku-base.js"' in html
          assert 'src="dbz/sprites.js"' in html
          raw=Path('dbz/goku_base_views.png').read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', 'Invalid PNG signature'
          w,h=struct.unpack('>II',raw[16:24])
          assert (w,h)==(256,64), f'Unexpected atlas dimensions: {w}x{h}'
          source=Path('dbz/goku-base.js').read_text(encoding='utf-8')
          assert 'G.SPRITE_META[1]=meta' in source
          assert 'for(let row=0;row<8;row++)' in source
          print('Goku alpha static checks passed')
          PY
